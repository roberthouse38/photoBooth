    <!-- Bootstrap Modal untuk Zoom Foto -->
    <div class="modal fade" id="photoModal" tabindex="-1" aria-labelledby="photoModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold text-dark" id="photoModalLabel"><i class="bi bi-image"></i> Detail Foto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center bg-light p-4">
                    <img id="modalImage" src="" class="img-fluid rounded shadow" style="max-height: 70vh; object-fit: contain;">
                </div>
                <div class="modal-footer justify-content-between">
                    <span id="modalMeta" class="text-muted small"></span>
                    <a id="modalDownload" href="" download="photobooth.png" class="btn btn-primary btn-sm px-3">

                    </a>

</body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <!-- fungsi dari chris getdata -->
    <script>
        const photoGallery = document.getElementById("photoGallery");

        async function loadPhotos() {
            try {
                const response = await fetch("http://localhost:3000/photos");
                if (!response.ok) throw new Error();
                const photos = await response.json();

                if (photos.length === 0) {
                    photoGallery.innerHTML = '<div class="col-12 text-center text-muted"><p class="fs-5 mt-4">Belum ada foto yang tersimpan.</p></div>';
                    return;
                }

                // Render semua foto 
                photoGallery.innerHTML = photos.map(photo => `
                    <div class="col-md-4 col-sm-6 mb-3">
                        <div class="card h-100 shadow-sm border-0">
                            <img 
                                src="http://localhost:3000/uploads/${photo.filename}" 
                                class="card-img-top img-fluid rounded" 
                                style="object-fit: cover; aspect-ratio: 4/3; cursor: pointer;"
                                onclick="showModal('${photo.filename}', '${photo.filter || 'None'}', '${photo.layout || 'Grid'}', '${photo.created_at}')"
                                onerror="this.src='https://placehold.co/400x300?text=Gambar+Tidak+Ditemukan'"
                            >
                            <div class="card-body p-2 text-center">
                                <small class="text-muted d-block">Filter: <span class="badge bg-secondary">${photo.filter || 'None'}</span></small>
                                <small class="text-muted d-block">Layout: <span class="badge bg-dark">${photo.layout || 'Grid'}</span></small>
                                <small class="text-muted" style="font-size: 11px;">
                                    ${new Date(photo.created_at).toLocaleString('id-ID')}
                                </small>
                            </div>
                        </div>
                    </div>
                `).join('');

            } catch (error) {
                photoGallery.innerHTML = '<div class="col-12 text-center text-danger"><p class="fs-5 mt-4">Gagal memuat gallery. Pastikan backend server Anda sudah berjalan!</p></div>';
            }
        }

        // Fungsi klik untuk menampilkan Modal Detail Foto
        function showModal(filename, filter, layout, createdAt) {
            const imageUrl = `http://localhost:3000/uploads/${filename}`;
            document.getElementById("modalImage").src = imageUrl;
            document.getElementById("modalDownload").href = imageUrl;
            document.getElementById("modalMeta").innerHTML = `
                Filter: <strong>${filter}</strong> | 
                Layout: <strong>${layout}</strong> | 
                Tanggal: <strong>${new Date(createdAt).toLocaleString('id-ID')}</strong>
            `;
            new bootstrap.Modal(document.getElementById('photoModal')).show();
        }

        document.addEventListener("DOMContentLoaded", loadPhotos);
    </script>
